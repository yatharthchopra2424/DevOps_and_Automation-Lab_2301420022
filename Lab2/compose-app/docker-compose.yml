services:
  web:
    build: ./web
    image: lab2-compose-web:1.0
    container_name: lab2-compose-web
    ports:
      - "5001:5000"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: lab2-compose-redis
    expose:
      - "6379"
