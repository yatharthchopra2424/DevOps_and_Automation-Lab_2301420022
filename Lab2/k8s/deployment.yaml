apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab2-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lab2-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: lab2-app
    spec:
      containers:
        - name: web
          image: lab2-python-app:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
