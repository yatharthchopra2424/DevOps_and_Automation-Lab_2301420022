services:
  stable:
    image: lab4-app:1.0
    container_name: lab4-stable
    environment:
      - APP_VERSION=1.0-stable
    networks:
      - canary-net

  canary:
    image: lab4-app:2.0
    container_name: lab4-canary
    environment:
      - APP_VERSION=2.0-canary
    networks:
      - canary-net

  nginx:
    image: nginx:alpine
    container_name: lab4-canary-nginx
    ports:
      - "5400:80"
    volumes:
      - ./conf:/etc/nginx/conf.d
    networks:
      - canary-net
    depends_on:
      - stable
      - canary

networks:
  canary-net:
    driver: bridge
