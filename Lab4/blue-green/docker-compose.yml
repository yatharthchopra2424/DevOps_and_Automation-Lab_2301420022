services:
  blue:
    image: lab4-app:1.0
    container_name: lab4-blue
    environment:
      - APP_VERSION=1.0-blue
    networks:
      - bg-net

  green:
    image: lab4-app:2.0
    container_name: lab4-green
    environment:
      - APP_VERSION=2.0-green
    networks:
      - bg-net

  nginx:
    image: nginx:alpine
    container_name: lab4-bg-nginx
    ports:
      - "5300:80"
    volumes:
      - ./conf:/etc/nginx/conf.d
    networks:
      - bg-net
    depends_on:
      - blue
      - green

networks:
  bg-net:
    driver: bridge
